spring.application.name=workshop-springboot4-jpa

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sb_study}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sb_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sb_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

spring.profiles.active=test